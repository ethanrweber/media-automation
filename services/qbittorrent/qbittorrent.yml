services:
  # unlike every other sidecar, nothing joins this one's network namespace —
  # qbittorrent is locked into gluetun's. it reverse-proxies to gluetun:8080 instead.
  ts-qbittorrent:
    extends:
      file: ../tailscale-sidecar.yml
      service: tailscale-sidecar
    container_name: ts-qbittorrent
    hostname: qbittorrent
    volumes:
      - ${CONFIG_ROOT}/ts-qbittorrent/state:/var/lib/tailscale
      - ./ts-qbittorrent-config:/config:ro # tailscale only reads serve-config.json, never writes here

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${CONFIG_ROOT}/Qbittorrent/appdata:/config
      - ${DOWNLOADS_ROOT}:/data/downloads # should match other download directories
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
