---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- home-row-1:
    - Media:
        - Plex:
            icon: plex.png
            href: https://app.plex.tv/
            description: Plex is a media server that organizes your personal media and streams it to your devices.
            ping: "{{HOMEPAGE_VAR_PLEX_URL}}"
            widgets:
              - type: plex
                url: "{{HOMEPAGE_VAR_PLEX_URL}}"
                key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
                fields: ["movies", "tv"]
              - type: tautulli
                url: http://ts-tautulli:8181
                key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
                enableUser: true # optional, defaults to false
                showEpisodeNumber: true # optional, defaults to false
                expandOneStreamToTwoRows: false # optional, defaults to true

        - Komga:
            icon: komga.png
            href: https://komga.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Komga is a comics/manga server
            ping: http://ts-komga:25600
            widget:
              type: komga
              url: http://ts-komga:25600
              username: "{{HOMEPAGE_VAR_KOMGA_USERNAME}}"
              password: "{{HOMEPAGE_VAR_KOMGA_PASSWORD}}"

        - Calibre-Web-Automated:
            icon: calibre-web.png
            href: https://calibre.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Calibre-Web-Automated is a web-based e-book library manager
            ping: http://ts-calibre-web-automated:8083
            widget:
              type: calibreweb
              url: http://ts-calibre-web-automated:8083
              username: "{{HOMEPAGE_VAR_CALIBRE_USERNAME}}"
              password: "{{HOMEPAGE_VAR_CALIBRE_PASSWORD}}"

    - Release Calendar:
        - Calendar:
            widget:
              type: calendar
              firstDayInWeek: monday
              view: monthly
              maxEvents: 10
              showTime: true
              timezone: America/Chicago
              integrations:
                - type: sonarr
                  service_group: Media Automation (Tailnet Only)
                  service_name: Sonarr
                  color: green
                  params:
                    unmonitored: false
                - type: radarr
                  service_group: Media Automation (Tailnet Only)
                  service_name: Radarr
                  color: blue
                  params:
                    unmonitored: false

- home-row-2:
    - Media Automation (Tailnet Only):
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Prowlarr is an indexer manager for *arr applications
            ping: http://ts-prowlarr:9696
            widget:
              type: prowlarr
              url: http://ts-prowlarr:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Sonarr is a TV series management tool that automates the process of finding, downloading, and organizing TV shows.
            ping: http://ts-sonarr:8989
            widget:
              type: sonarr
              url: http://ts-sonarr:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
              enableQueue: true # optional, defaults to false

        - Radarr:
            icon: radarr.png
            href: https://radarr.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Radarr is a movie management tool that automates the process of finding, downloading, and organizing movies.
            ping: http://ts-radarr:7878
            widget:
              type: radarr
              url: http://ts-radarr:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
              enableQueue: true # optional, defaults to false

        - Bazarr:
            icon: bazarr.png
            href: https://bazarr.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Bazarr manages and downloads subtitles for media managed by Sonarr and Radarr
            ping: http://ts-bazarr:6767
            widget:
              type: bazarr
              url: http://ts-bazarr:6767
              key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

        - Shelfmark:
            icon: shelfmark.png
            href: https://shelfmark.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Shelfmark is a book downloading tool
            ping: http://ts-shelfmark:8084

    - Infrastructure (Tailnet Only):
        - Portainer:
            icon: portainer.png
            href: https://portainer.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Portainer is a Docker management UI
            ping: http://ts-portainer:9000
            widget:
              type: portainer
              url: http://ts-portainer:9000
              env: "{{HOMEPAGE_VAR_PORTAINER_ENV}}"
              key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
              fields: ["running", "stopped", "total"]

        - qBittorrent:
            icon: qbittorrent.png
            href: https://qbittorrent.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: qBittorrent WebUI (routed through ProtonVPN via Gluetun)
            ping: http://gluetun:8080
            widget:
              type: qbittorrent
              url: http://gluetun:8080
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
              enableLeechProgress: true
              enableLeechSize: true
              fields: ["leech", "download", "seed", "upload"]

        - Tautulli:
            icon: tautulli.png
            href: https://tautulli.{{HOMEPAGE_VAR_TS_DOMAIN}}/
            description: Media Monitoring for Plex
            ping: https://ts-tautulli:8181

        - Smokeping:
            icon: smokeping.png
            # NOTE: use & (not smokeping's usual ;) as the query separator — tailscale
            # serve's Go reverse proxy strips semicolon-separated query params entirely.
            # relative urls: smokeping is path-proxied through the homepage origin
            # (ts-homepage serve config) so the widget also works via funnel from
            # outside the tailnet, where smokeping's own hostname doesn't resolve.
            href: /smokeping/?displaymode=n&start=-3h&end=now&target=ISP.FirstHop
            description: Smokeping graphs network latency over time
            ping: http://ts-smokeping:80
            widget:
              type: iframe
              name: smokeping-latency
              src: /smokeping/?displaymode=a&start=-3h&end=now&target=ISP.FirstHop
              allowScrolling: no
              refreshInterval: 300000

        - Funnel Latency:
            icon: tailscale.png
            # Tailnet.AllFunnels is a smokeping multihost target: it overlays the three
            # per-service funnel graphs into one chart without probing anything itself.
            # 24h window (not 3h like the graph above) because sidecar DERP degradation
            # comes on slowly — a short window shows it as flat-high with no baseline.
            # same url rules as the Smokeping widget above: relative path, & separators.
            href: /smokeping/?displaymode=n&start=-24h&end=now&target=Tailnet.AllFunnels
            description: Tailscale funnel response time — one line diverging means that sidecar needs a restart
            ping: http://ts-smokeping:80
            widget:
              type: iframe
              name: funnel-latency
              src: /smokeping/?displaymode=a&start=-24h&end=now&target=Tailnet.AllFunnels
              allowScrolling: no
              refreshInterval: 300000

- system-row-1:
    - pve-1:
        widget:
          type: proxmox
          url: https://192.168.1.205:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_USER}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_SECRET}}"
          node: pve-1

- system-row-2:
    - Storage:
        - SnapRAID Sync:
            icon: mdi-harddisk
            href: https://healthchecks.io/
            description: Daily SnapRAID parity sync on the Proxmox host (pve-1)
            widgets:
              - type: healthchecks
                url: https://healthchecks.io
                key: "{{HOMEPAGE_VAR_HEALTHCHECKS_KEY}}"
                uuid: "{{HOMEPAGE_VAR_HEALTHCHECKS_UUID}}" # single-check: status + last_ping
