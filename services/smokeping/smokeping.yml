services:
  ts-smokeping:
    extends:
      file: ../tailscale-sidecar.yml
      service: tailscale-sidecar
    container_name: ts-smokeping
    hostname: smokeping
    volumes:
      - ${CONFIG_ROOT}/ts-smokeping/state:/var/lib/tailscale
      - ./ts-smokeping-config:/config
    ports:
      - 8085:80 # keep LAN access alongside the tailnet hostname

  smokeping:
    image: lscr.io/linuxserver/smokeping:latest
    container_name: smokeping
    network_mode: service:ts-smokeping
    depends_on:
      ts-smokeping:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TS_DOMAIN=${TS_DOMAIN} # substituted into Targets.template at startup
    volumes:
      - ${CONFIG_ROOT}/SmokePing/config:/config
      - ./smokeping-config/Targets.template:/config/Targets.template:ro # repo-managed; rendered to /config/Targets by the init script
      - ./smokeping-init:/custom-cont-init.d:ro
      - ${CONFIG_ROOT}/SmokePing/data:/data
    restart: unless-stopped
